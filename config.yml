# KULASIS への接続設定。
# 【重要・未検証】ドメイン名は確認できていない。ブラウザのアドレスバーで
#   履修(人数)制限ページを開いたときの実URLに置き換えること。

login:
  start_url: "https://www.k.kyoto-u.ac.jp/student/la/top"

pages:
  # 【未検証・要確認】ユーザー提供HTMLのパスは /student/la/entrylimit/regist。
  # ドメインは KULASIS の一般的なホスト（例: https://www.k.kyoto-u.ac.jp）を
  # 仮置きしている。ブラウザで実際に開いてURLをコピーし、ここを置き換えること。
  entrylimit: "https://www.k.kyoto-u.ac.jp/student/la/entrylimit/regist"

apply:
  # 【要注意・未検証】true にすると、空きを検知した瞬間に自動で「申込」を送信する。
  # 1クリックで確定するのか確認画面を挟むのか未検証。
  # 必ず --dry-run と、ローカルでの1回だけの手動実行で挙動を確認してからtrue にすること。
  # 取り消しができない可能性がある。
  auto_apply: true
  fail_notify_threshold: 3  # 申込が何回"連続"失敗したら通知するか
