name: check

# cron-job.org から workflow_dispatch API で5分おきに起動する。
# GitHub の schedule: は使わない（遅延・スキップが起きうるため）。
on:
  workflow_dispatch:

# 前回の実行が長引いても重ならないようにする（待機中の実行は最新の1件だけ残る）
concurrency:
  group: kulasis-check
  cancel-in-progress: false

permissions:
  contents: write # state.json をコミットするため

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check seats
        env:
          KULASIS_USER: ${{ secrets.KULASIS_USER }}
          KULASIS_PASSWORD: ${{ secrets.KULASIS_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        # 自動申込(apply.auto_apply)を有効化する場合は、まずローカルで
        # --dry-run と1回きりの手動実行で挙動を確認してから true にすること。
        run: python -m src.main

      - name: Commit state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state"
            git push
          fi
