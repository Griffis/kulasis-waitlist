name: KULASIS Monitor

on:
  workflow_dispatch: # GitHubのWeb画面から手動で実行できるようにする設定

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードを取得
      # Checkout（チェックアウト：Gitリポジトリからコードを引き出して準備する作業）
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 依存ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 監視Botの実行
      # 4. 監視Botの実行
      - name: Run KULASIS Monitor Bot
        env:
          KULASIS_USER: ${{ secrets.KULASIS_USER }}
          KULASIS_PASSWORD: ${{ secrets.KULASIS_PASSWORD }}
          KULASIS_TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m src.main
