name: KULASIS Monitor

on:
  workflow_dispatch:

concurrency:
  group: kulasis-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run KULASIS Monitor Bot
        env:
          KULASIS_USER: ${{ secrets.KULASIS_USER }}
          KULASIS_PASSWORD: ${{ secrets.KULASIS_PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit state.json
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update state"
          file_pattern: "state.json"